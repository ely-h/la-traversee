<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manette-La Traversee</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="login-container">
        <h1 class="game-title">La Traversee</h1>

        <div class="login-card">
            <h2>Connexion</h2>

            <label for="pseudo-input">Pseudo</label>
            <input type="text" id="pseudo-input" placeholder="JeMangeCailloux91" maxlength="16">

            <label for="color-picker-input">Couleur du joueur :</label>
            <input type="color" id="color-picker-input" value="#ff5757">

            <p id="error-message" style="display: none; color: #ff5757; text-align: center; font-weight: bold; margin-bottom: 15px; font-size: 1rem; width: 100%;"></p>
            <button id="join-button">Rejoindre</button>
        </div>
    </div>

    <div id="waiting-container" style="display: none;">
        <h1 class="game-title">Salle d'attente</h1>
        <div class="waiting-card">
            <p id="waiting-status">Connexion au lobby...</p>
            <p id="waiting-player-name"></p>
            <p id="waiting-count"></p>
        </div>
    </div>

    <div id="ui-container" style="display: none;">
        <h1 id="status-text">Connexion...</h1>
        <div id="joystick-zone"></div>
        <button id="dash-button">Dash</button>
    </div>

    <div id="game-over-container" style="display: none;">
        <h1 class="game-title" id="game-over-title">Partie Terminée</h1>
        <div class="game-over-card">
            <h2 id="winning-team-text">L'équipe a gagné !</h2>
            <div id="winners-list-container">
                <h3>Joueurs Victorieux:</h3>
                <ul id="winners-list"></ul>
            </div>
            <p id="game-over-message"></p>
        </div>
    </div>

    <div id="reconnect-overlay" style="display: none;">
        <h2>Connexion perdue...</h2>
        <p>Reconnexion en cours</p>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="nipplejs.min.js"></script>
    <script src="client.js"></script>
</body>

</html>
